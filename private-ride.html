<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="description" content="Private SarapMagBike group ride map and chat.">
    <title>Private Group Ride | SarapMagBike Shop</title>
    <link rel="icon" href="assets/sarapmagbike-logo.png">
    <link rel="stylesheet" href="styles.css?v=20260810-private-ride-title-refresh-v33">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#df2027">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
  </head>
  <body class="is-private-ride-page">
    <div class="page-bg"></div>
    <div class="wrap header-main">
      <a class="logo" href="index.html" aria-label="SarapMagBike Shop home">
        <img src="assets/sarapmagbike-logo.png" alt="SarapMagBike Shop logo">
        <span class="logo-word">SARAPMAG<span>BIKE</span></span>
        <span class="logo-tag">QUEZON CITY</span>
      </a>
      <div class="mobile-header-actions" aria-label="Mobile quick actions">
        <button class="mobile-header-account" type="button" data-mobile-header-login aria-label="Log in or create an account" title="Account">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path></svg>
        </button>
      </div>
      <div class="customer-login" data-customer-login-form aria-label="Customer account">
        <button type="button" data-desktop-header-login>Login</button>
        <button type="button" data-open-register>Register</button>
      </div>
      <div class="customer-session" data-customer-session hidden>
        <button class="account-avatar-button" type="button" data-account-menu-toggle aria-label="Open account menu" aria-expanded="false"><span data-account-avatar>SMB</span></button>
      </div>
    </div>
    <main class="wrap private-ride-page-main" data-private-ride-page>
      <a class="private-ride-page-back" href="index.html#private-rides" aria-label="Back to private rides" title="Back to private rides">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <section class="private-ride-page-shell" aria-live="polite">
        <div class="private-ride-page-content" data-private-ride-page-content>
          <p class="private-ride-page-loading">Loading private ride…</p>
        </div>
      </section>
    </main>
    <nav class="mobile-bottom-nav" aria-label="Mobile private ride navigation">
      <a href="index.html#top" data-mobile-nav="home" aria-label="Home"><span aria-hidden="true">⌂</span>Home</a>
      <a href="index.html#products" data-mobile-nav="catalog" aria-label="Catalog"><span aria-hidden="true">▦</span>Catalog</a>
      <a href="services.html" data-mobile-nav="services" aria-label="Services"><span aria-hidden="true">⚙</span>Services</a>
      <a href="events.html" data-mobile-nav="events" aria-label="Events"><span aria-hidden="true">◴</span>Events</a>
      <a href="index.html#community" data-mobile-nav="community" aria-label="Community"><span aria-hidden="true">◴</span>Community</a>
      <a href="stories.html" data-mobile-nav="stories" aria-label="Stories"><span aria-hidden="true">▤</span>Stories</a>
    </nav>
    <script src="config.js?v=20260703-staging-api"></script>
    <script src="script.js?v=20260810-private-ride-title-refresh-v33"></script>
